upstream auth_service {
    server auth-service:5001;
}

upstream post_service {
    server post-service:5002;
}

upstream user_service {
    server user-service:5003;
}

upstream analytics_service {
    server analytics-service:5004;
}

upstream search_service {
    server search-service:5005;
}

upstream notification_service {
    server notification-service:5006;
}

server {
    listen 8080;

    # Auth routes
    location /api/auth/ {
        proxy_pass http://auth_service/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Post routes
    location /api/posts/ {
        proxy_pass http://post_service/posts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # User routes
    location /api/users/ {
        proxy_pass http://user_service/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Analytics routes
    location /api/analytics/ {
        proxy_pass http://analytics_service/analytics/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Search routes
    location /api/search/ {
        proxy_pass http://search_service/search/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Notification routes
    location /api/notifications/ {
        proxy_pass http://notification_service/notifications/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check
    location /health {
        return 200 '{"status":"healthy","service":"api-gateway"}';
        add_header Content-Type application/json;
    }
}
