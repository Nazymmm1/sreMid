groups:
  - name: blog_slo_alerts
    interval: 30s
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
          component: backend
        annotations:
          summary: "Backend service is down"
          description: "Backend is unreachable - possible database misconfiguration"

      - alert: LowRequestRate
        expr: rate(http_request_duration_seconds_count[5m]) < 0.1
        for: 2m
        labels:
          severity: warning
          component: backend
        annotations:
          summary: "Very low request rate detected"
          description: "Request rate is {{ $value }} req/s"

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 2m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% - current value: {{ $value }}%"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) * 100 > 5
        for: 1m
        labels:
          severity: critical
          component: backend
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }}% which is above 5% threshold"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.3
        for: 2m
        labels:
          severity: warning
          component: backend
        annotations:
          summary: "High response time detected"
          description: "P95 response time is {{ $value }}s which exceeds 300ms SLO"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 2m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }}% which is above 85% threshold"