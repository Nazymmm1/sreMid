groups:
  - name: blog_slo_alerts
    interval: 30s
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
          component: backend
        annotations:
          summary: "Backend service is down"
          description: "Backend is unreachable - possible database misconfiguration"

      - alert: LowRequestRate
        expr: rate(http_request_duration_seconds_count[5m]) < 0.1
        for: 2m
        labels:
          severity: warning
          component: backend
        annotations:
          summary: "Very low request rate detected"
          description: "Request rate is {{ $value }} req/s"